<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VS Web Studio Voice Agent</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>VS Web Studio Voice Agent</h1>
      <p>Lokales Voice Quality Lab für einen fairen Hörvergleich.</p>

      <div class="settings">
        <label for="mode">Mode</label>
        <select id="mode">
          <option value="live" selected>Live — preferred</option>
          <option value="realtime">Realtime — fallback</option>
        </select>

        <span>Provider / model</span>
        <output id="model" for="mode">OpenAI / gpt-live-1</output>

        <label for="voice">Voice</label>
        <select id="voice">
          <option value="shimmer">shimmer</option>
          <option value="coral">coral</option>
          <option value="marin" selected>marin</option>
          <option value="nova" disabled>nova — unavailable in installed SDK</option>
        </select>

        <label for="output-volume">Output volume</label>
        <div class="volume-control">
          <input
            id="output-volume"
            type="range"
            min="0"
            max="100"
            step="1"
            value="70"
          />
          <output id="output-volume-value" for="output-volume">70%</output>
        </div>

        <div id="leadflow-context" class="leadflow-context" hidden>
          <span>Company: <strong id="leadflow-company"></strong></span>
          <span id="leadflow-contact-row" hidden>
            Contact: <strong id="leadflow-contact"></strong>
          </span>
        </div>

        <div id="leadflow-dev-fallback" class="leadflow-dev-fallback" hidden>
          <label for="leadflow-lead-id">Developer fallback — LeadFlow Lead ID</label>
          <input
            id="leadflow-lead-id"
            type="text"
            maxlength="200"
            autocomplete="off"
            placeholder="Development only"
          />
        </div>
      </div>

      <div class="controls">
        <button id="start" type="button" disabled>Start conversation</button>
        <button id="end" type="button" disabled>End conversation</button>
      </div>

      <p>Status: <strong id="status" role="status" aria-live="polite">Ready</strong></p>
      <p class="tool-activity">
        Last tool activity:
        <strong id="tool-activity" role="status" aria-live="polite">None</strong>
      </p>
      <p class="tool-activity">
        LeadFlow:
        <strong id="leadflow-status" role="status" aria-live="polite">Not configured</strong>
      </p>
      <audio id="remote-audio" autoplay playsinline></audio>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
